[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jointcheck-solder-inspection"
version = "0.3.0"
description = "JointCheck — Solder Joint Workmanship Inspection with Proof"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "duckdb>=0.10.0",
    "openai>=1.14.0",
    "jinja2>=3.1.3",
    "jsonschema>=4.21.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.gate" = ["workmanship-rules.v0.json"]
"app.vision" = ["condition-codes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
